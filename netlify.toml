# Netlify picks up the Next.js runtime automatically, but naming it here means
# the build does not depend on framework detection guessing right.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Next 16 needs Node 20.9 or newer.
  NODE_VERSION = "22"
